name: tests

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # 本程序直接操作 Windows 注册表，必须在 Windows runner 上测试
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安全与核心逻辑验收测试
        run: python tests/test_security.py

      - name: 冒烟测试（枚举 / 推导 / 端到端生成）
        run: python tests/smoke_test.py

      - name: 语法检查
        run: |
          python -m py_compile src/ime_icon_tool.pyw
          python -m py_compile src/peicon.py
          python -m py_compile scripts/build_release.py
