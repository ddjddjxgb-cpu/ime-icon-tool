name: release

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "可选版本标签（例如 v1.2.1）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装构建与运行依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=5.0"

      - name: 测试并构建发布压缩包
        run: python scripts/build_release.py

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ImeIconTool-win64
          path: |
            dist/release/ImeIconTool-win64.zip
            dist/release/SHA256SUMS.txt
            dist/release/RELEASE_NOTES.md

      - name: 发布 GitHub Release（Tag 触发时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: IME 任务栏图标工具 ${{ env.RELEASE_VERSION }}
          body_path: dist/release/RELEASE_NOTES.md
          generate_release_notes: false
          files: |
            dist/release/ImeIconTool-win64.zip
            dist/release/SHA256SUMS.txt
