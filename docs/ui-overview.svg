<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="100%" role="img" aria-labelledby="uiTitle uiDesc">
  <title id="uiTitle">IME 任务栏图标工具的三步向导界面</title>
  <desc id="uiDesc">界面分三步：第一步枚举本机输入法并列出图标来源；第二步选择字符、字体、字重、字号，并按 16、20、24、32 像素的真实尺寸预览；第三步依次生成图标文件、备份原设置、写入注册表，写入需要管理员确认，另有还原按钮可随时回滚。</desc>

  <rect width="1000" height="470" fill="#FFFFFF"/>
  <!-- svg-audit:ignore-small 12 -->
  <!-- 12px 仅用于预览区「16 像素」那一枚图标，刻意做小以示意任务栏真实观感 -->

  <!-- 顶部说明 -->
  <text x="30" y="42" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="600" fill="#2C2C2A">三步向导</text>
  <text x="30" y="72" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#5F5E5A">选输入法 → 设计图标 → 应用更改</text>

  <!-- ================= 面板一：选择输入法 ================= -->
  <rect x="30" y="96" width="298" height="344" rx="12" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
  <path d="M30 108 A12 12 0 0 1 42 96 L316 96 A12 12 0 0 1 328 108 L328 142 L30 142 Z" fill="#E1F5EE"/>
  <line x1="30" y1="142" x2="328" y2="142" stroke="#9FE1CB" stroke-width="1"/>
  <text x="50" y="120" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="600" fill="#085041" dominant-baseline="central">① 选择输入法</text>

  <text x="50" y="168" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#888780" dominant-baseline="central">名称</text>
  <text x="308" y="168" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#888780" text-anchor="end" dominant-baseline="central">图标来源</text>

  <rect x="44" y="184" width="270" height="44" rx="7" fill="#E1F5EE"/>
  <text x="58" y="206" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#085041" dominant-baseline="central">输入法 A</text>
  <text x="302" y="206" font-family="Consolas, Courier New, monospace" font-size="15" fill="#0F6E56" text-anchor="end" dominant-baseline="central">tsf-oime.dll</text>

  <rect x="44" y="236" width="270" height="44" rx="7" fill="#F1EFE8"/>
  <text x="58" y="258" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#444441" dominant-baseline="central">输入法 B</text>
  <text x="302" y="258" font-family="Consolas, Courier New, monospace" font-size="15" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">ResourceDll.dll</text>

  <rect x="44" y="288" width="270" height="44" rx="7" fill="#F1EFE8"/>
  <text x="58" y="310" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#444441" dominant-baseline="central">输入法 C</text>
  <text x="302" y="310" font-family="Consolas, Courier New, monospace" font-size="15" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">imekr.dll</text>

  <rect x="44" y="340" width="270" height="44" rx="7" fill="#F1EFE8"/>
  <text x="58" y="362" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#444441" dominant-baseline="central">输入法 D</text>
  <text x="302" y="362" font-family="Consolas, Courier New, monospace" font-size="15" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">wetype.dll</text>

  <text x="50" y="408" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#888780" dominant-baseline="central">自动枚举本机全部输入法，</text>
  <text x="50" y="428" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#888780" dominant-baseline="central">右侧显示当前图标来源</text>

  <!-- 箭头 1→2 -->
  <path d="M338 268 L378 268" stroke="#B4B2A9" stroke-width="2" fill="none"/>
  <path d="M372 261 L382 268 L372 275 Z" fill="#B4B2A9"/>

  <!-- ================= 面板二：设计图标 ================= -->
  <rect x="392" y="96" width="298" height="344" rx="12" fill="#FFFFFF" stroke="#185FA5" stroke-width="1"/>
  <path d="M392 108 A12 12 0 0 1 404 96 L678 96 A12 12 0 0 1 690 108 L690 142 L392 142 Z" fill="#E6F1FB"/>
  <line x1="392" y1="142" x2="690" y2="142" stroke="#B5D4F4" stroke-width="1"/>
  <text x="412" y="120" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="600" fill="#042C53" dominant-baseline="central">② 设计图标</text>

  <text x="412" y="172" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#444441" dominant-baseline="central">字符</text>
  <rect x="468" y="156" width="46" height="32" rx="7" fill="#E6F1FB" stroke="#85B7EB" stroke-width="1"/>
  <text x="491" y="172" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#042C53" text-anchor="middle" dominant-baseline="central">中</text>
  <text x="532" y="172" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#444441" dominant-baseline="central">字体</text>
  <rect x="586" y="156" width="84" height="32" rx="7" fill="#F1EFE8"/>
  <text x="628" y="172" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#444441" text-anchor="middle" dominant-baseline="central">雅黑</text>

  <text x="412" y="222" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#444441" dominant-baseline="central">字重</text>
  <circle cx="474" cy="222" r="8" fill="#185FA5"/>
  <circle cx="474" cy="222" r="3" fill="#FFFFFF"/>
  <text x="490" y="222" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#444441" dominant-baseline="central">常规</text>
  <circle cx="560" cy="222" r="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
  <text x="576" y="222" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#888780" dominant-baseline="central">细体</text>
  <circle cx="638" cy="222" r="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
  <text x="654" y="222" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#888780" dominant-baseline="central">加粗</text>

  <text x="412" y="268" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#444441" dominant-baseline="central">字号</text>
  <line x1="466" y1="268" x2="620" y2="268" stroke="#D3D1C7" stroke-width="4" stroke-linecap="round"/>
  <line x1="466" y1="268" x2="546" y2="268" stroke="#185FA5" stroke-width="4" stroke-linecap="round"/>
  <circle cx="546" cy="268" r="10" fill="#185FA5"/>
  <text x="634" y="268" font-family="Consolas, Courier New, monospace" font-size="17" fill="#185FA5" dominant-baseline="central">0.86</text>

  <text x="412" y="306" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#888780" dominant-baseline="central">实际像素预览</text>
  <rect x="412" y="320" width="258" height="72" rx="9" fill="#F1EFE8"/>

  <text x="440" y="352" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">中</text>
  <text x="482" y="352" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">中</text>
  <text x="532" y="352" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">中</text>
  <text x="602" y="352" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="28" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">中</text>
  <text x="440" y="380" font-family="Consolas, Courier New, monospace" font-size="15" fill="#888780" text-anchor="middle" dominant-baseline="central">16</text>
  <text x="482" y="380" font-family="Consolas, Courier New, monospace" font-size="15" fill="#888780" text-anchor="middle" dominant-baseline="central">20</text>
  <text x="532" y="380" font-family="Consolas, Courier New, monospace" font-size="15" fill="#888780" text-anchor="middle" dominant-baseline="central">24</text>
  <text x="602" y="380" font-family="Consolas, Courier New, monospace" font-size="15" fill="#888780" text-anchor="middle" dominant-baseline="central">32</text>

  <text x="412" y="410" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#888780" dominant-baseline="central">按任务栏真实像素渲染，</text>
  <text x="412" y="428" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#888780" dominant-baseline="central">可切深色背景对比</text>

  <!-- 箭头 2→3 -->
  <path d="M700 268 L740 268" stroke="#B4B2A9" stroke-width="2" fill="none"/>
  <path d="M734 261 L744 268 L734 275 Z" fill="#B4B2A9"/>

  <!-- ================= 面板三：应用更改 ================= -->
  <rect x="754" y="96" width="216" height="344" rx="12" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
  <path d="M754 108 A12 12 0 0 1 766 96 L958 96 A12 12 0 0 1 970 108 L970 142 L754 142 Z" fill="#EEEDFE"/>
  <line x1="754" y1="142" x2="970" y2="142" stroke="#CECBF6" stroke-width="1"/>
  <text x="774" y="120" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="600" fill="#3C3489" dominant-baseline="central">③ 应用更改</text>

  <circle cx="786" cy="182" r="13" fill="#EEEDFE"/>
  <text x="786" y="182" font-family="Consolas, Courier New, monospace" font-size="15" fill="#3C3489" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="812" y="182" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#444441" dominant-baseline="central">生成图标文件</text>

  <circle cx="786" cy="230" r="13" fill="#EEEDFE"/>
  <text x="786" y="230" font-family="Consolas, Courier New, monospace" font-size="15" fill="#3C3489" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="812" y="230" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#444441" dominant-baseline="central">备份原设置</text>

  <circle cx="786" cy="278" r="13" fill="#FAC775"/>
  <text x="786" y="278" font-family="Consolas, Courier New, monospace" font-size="15" fill="#412402" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="812" y="271" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#444441" dominant-baseline="central">写入注册表</text>
  <text x="812" y="293" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#BA7517" dominant-baseline="central">需管理员确认</text>

  <rect x="774" y="330" width="176" height="44" rx="8" fill="#534AB7"/>
  <text x="862" y="352" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">开始应用</text>

  <rect x="774" y="388" width="176" height="44" rx="8" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1"/>
  <text x="862" y="410" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">还原原始图标</text>
</svg>
